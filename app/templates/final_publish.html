<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Publish Status - EDCH</title>
  <style>
    /* Reset & Base Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #626363; /* Slate 900 */
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh; 
      color: #f8fafc;
      flex-direction: column;
    }
    .container { 
      width: 100%; 
      max-width: 750px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    /* Spinner Styles */
    .spinner-wrapper { position: relative; width: 56px; height: 56px; margin-bottom: 20px; transition: opacity 0.3s; }
    .spinner-wrapper.hidden { opacity: 0; pointer-events: none; display: none; }
    .spinner-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #334155; }
    .spinner-progress { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 2px solid transparent; border-top-color: #10b981; animation: spin 1s linear infinite; }
    
    .logo-center { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      width: 24px; 
      height: 24px; 
      object-fit: contain;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Typography */
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; color: #f1f5f9; text-align: center; }
    h1.success-text { color: #a6e3a1; }
    .subtitle { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #94a3b8; margin-bottom: 24px; }

    /* Terminal Window Card */
    .terminal-card {
      width: 100%;
      background-color: #1e1e2e; 
      border-radius: 10px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #313244;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Terminal Header Bar */
    .terminal-header {
      background-color: #181825;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #313244;
      user-select: none;
    }
    .window-button { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .btn-close { background-color: #f38ba8; }
    .btn-minimize { background-color: #f9e2af; }
    .btn-maximize { background-color: #a6e3a1; }
    .terminal-title {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      font-size: 0.75rem;
      color: #a6adc8;
      margin-left: auto;
      margin-right: auto;
    }

    /* Terminal Screen Area */
    .terminal-body {
      padding: 16px;
      height: 320px;
      overflow-y: auto;
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cdd6f4;
      background-color: #11111b;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Terminal Log Line Styling */
    .log-line { display: flex; align-items: flex-start; gap: 8px; word-break: break-word; }
    .log-time { color: #585b70; flex-shrink: 0; font-size: 0.75rem; }
    .log-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    
    /* Log Types */
    .badge-info { background-color: #313244; color: #89b4fa; }
    .badge-success { background-color: #274d35; color: #a6e3a1; }
    .badge-warn { background-color: #5c4d23; color: #f9e2af; }
    
    .text-info { color: #cdd6f4; }
    .text-success { color: #a6e3a1; }
    .text-warn { color: #f9e2af; }

    /* Flashing Prompt Cursor */
    .terminal-prompt { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: #89b4fa; }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #89b4fa;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Custom Scrollbar for Terminal */
    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: #11111b; }
    .terminal-body::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: #45475a; }

    /* Return Button */
    .return-button {
      margin-top: 24px;
      padding: 12px 24px;
      background-color: #274d35;
      color: #a6e3a1;
      border: 1px solid #a6e3a1;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: none; /* Hidden until completion */
      align-items: center;
      gap: 8px;
    }
    .return-button:hover {
      background-color: #a6e3a1;
      color: #11111b;
    }
  </style>
</head>
<body>

  <div class="container">
    <div class="spinner-wrapper" id="main-spinner">
      <div class="spinner-bg"></div>
      <div class="spinner-progress"></div>
      <img src="{{ url_for('static', filename='images/Logo-EDCH.png') }}" alt="EDCH Logo" class="logo-center" onerror="this.style.display='none'">
    </div>
    
    <h1 id="main-title">Publishing to Production</h1>
    <p class="subtitle" id="subtitle-display">Migrating Document ID: {{ document.id }}</p>

    <!-- Terminal UI Component -->
    <div class="terminal-card">
      <div class="terminal-header">
        <span class="window-button btn-close"></span>
        <span class="window-button btn-minimize"></span>
        <span class="window-button btn-maximize"></span>
        <span class="terminal-title">postgres-admin@production-db:~ (Schema: PROD)</span>
      </div>
      <div class="terminal-body" id="terminal-body">
        <!-- Live logs will be dynamically injected here -->
      </div>
    </div>

    <!-- Success Return Button -->
    <a href="{{ url_for('dashboard.index') }}" class="return-button" id="return-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Return to Dashboard
    </a>
  </div>

  <script>
    class TerminalLoggerUI {
      constructor(config) {
        this.terminalBody = document.getElementById(config.terminalBodyId);
        this.titleElement = document.getElementById(config.titleElementId);
        this.subtitleElement = document.getElementById(config.subtitleElementId);
        this.spinnerElement = document.getElementById(config.spinnerElementId);
        this.returnBtn = document.getElementById(config.returnBtnId);
        
        this.initTerminal();
      }

      initTerminal() {
        this.appendLog("Establishing secure connection to PostgreSQL production cluster...", "info");
        this.addPromptLine();
      }

      getFormattedTime() {
        const now = new Date();
        return now.toTimeString().split(' ')[0];
      }

      appendLog(message, level = "info") {
        // Remove prompt line temporarily to append text above it
        const existingPrompt = this.terminalBody.querySelector('.terminal-prompt');
        if (existingPrompt) existingPrompt.remove();

        const line = document.createElement('div');
        line.className = 'log-line';
        
        const timeSpan = `<span class="log-time">[${this.getFormattedTime()}]</span>`;
        const badgeSpan = `<span class="log-badge badge-${level}">${level}</span>`;
        const messageSpan = `<span class="text-${level}">${message}</span>`;
        
        line.innerHTML = `${timeSpan} ${badgeSpan} ${messageSpan}`;
        this.terminalBody.appendChild(line);

        // Re-add prompt cursor line at bottom
        this.addPromptLine();

        // Auto-scroll to bottom
        this.terminalBody.scrollTop = this.terminalBody.scrollHeight;
      }

      addPromptLine() {
        const prompt = document.createElement('div');
        prompt.className = 'terminal-prompt';
        prompt.innerHTML = `<span>></span><span class="cursor"></span>`;
        this.terminalBody.appendChild(prompt);
      }

      completeProcess(finalTitle, finalSubtitle) {
        this.titleElement.textContent = finalTitle;
        this.titleElement.classList.add('success-text');
        this.subtitleElement.textContent = finalSubtitle;
        this.spinnerElement.classList.add('hidden');
        this.returnBtn.style.display = 'inline-flex';
        
        this.appendLog("All records have been securely moved to production.", "success");
      }
    }

    // Initialize Terminal Logger
    const terminalUI = new TerminalLoggerUI({
      terminalBodyId: 'terminal-body',
      titleElementId: 'main-title',
      subtitleElementId: 'subtitle-display',
      spinnerElementId: 'main-spinner',
      returnBtnId: 'return-btn'
    });

    // Simulated Database Publishing Steps
    const publishSteps = [
      { msg: "Validating signed report constraints and Manager signatures...", level: "warn" },
      { msg: "Migrating AGMT_HEADER_STG & AGMT_MODELS_STG records...", level: "info" },
      { msg: "Inserting AGMT_MDL_NORMAL_STG rates into production tables...", level: "info" },
      { msg: "Verifying AGMT_COMMITMENT entries and volumetric limits...", level: "info" },
      { msg: "Committing transaction to production DB... ACQUIRING ROW LOCKS...", level: "warn" },
      { msg: "Transaction committed successfully. System state synchronized.", level: "success" }
    ];

    let currentStep = 0;
    
    // Process steps exactly like the old progress bar, but in the terminal
    const simulateProgress = setInterval(() => {
      if (currentStep < publishSteps.length) {
        const step = publishSteps[currentStep];
        terminalUI.appendLog(step.msg, step.level);
        currentStep++;
      } else {
        clearInterval(simulateProgress);
        terminalUI.completeProcess("Successfully Published!", "Database migration complete.");
      }
    }, 1200); // 1.2 seconds per step

  </script>
</body>
</html>
