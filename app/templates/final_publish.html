<!DOCTYPE html>
<html lang="en">
<head>
  <!-- ==========================================
       DOCUMENT METADATA
       ========================================== -->
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Publish Status - EDCH</title>

  <!-- ==========================================
       STYLESHEETS
       ========================================== -->
  <style>
    /* -------------------------------------------
       1. Base & Reset
       ------------------------------------------- */
    * { 
      box-sizing: border-box; 
      margin: 0; 
      padding: 0; 
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #626363; /* Slate 900 */
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh; 
      color: #f8fafc;
      flex-direction: column;
    }

    /* -------------------------------------------
       2. Layout Containers
       ------------------------------------------- */
    .container { 
      width: 100%; 
      max-width: 750px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    /* -------------------------------------------
       3. Components: Loading Spinner
       ------------------------------------------- */
    .spinner-wrapper { 
      position: relative; 
      width: 56px; 
      height: 56px; 
      margin-bottom: 20px; 
      transition: opacity 0.3s; 
    }
    .spinner-wrapper.hidden { 
      opacity: 0; 
      pointer-events: none; 
      display: none; 
    }
    .spinner-bg { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      border: 2px solid #334155; 
    }
    .spinner-progress { 
      position: absolute; 
      top: 0; 
      left: 0; 
      width: 100%; 
      height: 100%; 
      border-radius: 50%; 
      border: 2px solid transparent; 
      border-top-color: #10b981; 
      animation: spin 1s linear infinite; 
    }
    .logo-center { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      width: 24px; 
      height: 24px; 
      object-fit: contain;
    }

    @keyframes spin { 
      100% { transform: rotate(360deg); } 
    }

    /* -------------------------------------------
       4. Typography
       ------------------------------------------- */
    h1 { 
      font-size: 1.4rem; 
      font-weight: 600; 
      margin-bottom: 6px; 
      color: #f1f5f9; 
      text-align: center; 
    }
    h1.success-text { color: #a6e3a1; }
    
    .subtitle { 
      font-family: ui-monospace, monospace; 
      font-size: 0.85rem; 
      color: #94a3b8; 
      margin-bottom: 24px; 
    }

    /* -------------------------------------------
       5. Components: Terminal UI Mockup
       ------------------------------------------- */
    /* Main Terminal Container */
    .terminal-card {
      width: 100%;
      background-color: #1e1e2e; 
      border-radius: 10px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #313244;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* macOS-style Header Bar */
    .terminal-header {
      background-color: #181825;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #313244;
      user-select: none;
    }
    .window-button { 
      width: 12px; 
      height: 12px; 
      border-radius: 50%; 
      display: inline-block; 
    }
    .btn-close { background-color: #f38ba8; }
    .btn-minimize { background-color: #f9e2af; }
    .btn-maximize { background-color: #a6e3a1; }
    
    .terminal-title {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      font-size: 0.75rem;
      color: #a6adc8;
      margin-left: auto;
      margin-right: auto;
    }

    /* Terminal Console Area */
    .terminal-body {
      padding: 16px;
      height: 320px;
      overflow-y: auto;
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cdd6f4;
      background-color: #11111b;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Log Entry Elements */
    .log-line { 
      display: flex; 
      align-items: flex-start; 
      gap: 8px; 
      word-break: break-word; 
    }
    .log-time { 
      color: #585b70; 
      flex-shrink: 0; 
      font-size: 0.75rem; 
    }
    .log-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    
    /* Log Severity Modifiers */
    .badge-info { background-color: #313244; color: #89b4fa; }
    .badge-success { background-color: #274d35; color: #a6e3a1; }
    .badge-warn { background-color: #5c4d23; color: #f9e2af; }
    
    .text-info { color: #cdd6f4; }
    .text-success { color: #a6e3a1; }
    .text-warn { color: #f9e2af; }

    /* Blinking Cursor Indicator */
    .terminal-prompt { 
      display: flex; 
      align-items: center; 
      gap: 8px; 
      margin-top: 4px; 
      color: #89b4fa; 
    }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #89b4fa;
      animation: blink 1s infinite;
    }
    @keyframes blink { 
      0%, 100% { opacity: 1; } 
      50% { opacity: 0; } 
    }

    /* -------------------------------------------
       6. Custom Scrollbar (Webkit)
       ------------------------------------------- */
    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: #11111b; }
    .terminal-body::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: #45475a; }

    /* -------------------------------------------
       7. Components: Call to Action Button
       ------------------------------------------- */
    .return-button {
      margin-top: 24px;
      padding: 12px 24px;
      background-color: #274d35;
      color: #a6e3a1;
      border: 1px solid #a6e3a1;
      border-radius: 6px;
      font-size: 0.9rem;
      font-weight: 600;
      text-decoration: none;
      transition: all 0.2s ease;
      display: none; /* Hidden during processing */
      align-items: center;
      gap: 8px;
    }
    .return-button:hover {
      background-color: #a6e3a1;
      color: #11111b;
    }
  </style>
</head>
<body>

  <!-- ==========================================
       MAIN APPLICATION CONTAINER
       ========================================== -->
  <div class="container">
    
    <!-- Header & Loading Indicator -->
    <div class="spinner-wrapper" id="main-spinner">
      <div class="spinner-bg"></div>
      <div class="spinner-progress"></div>
      <img src="{{ url_for('static', filename='images/Logo-EDCH.png') }}" alt="EDCH Logo" class="logo-center" onerror="this.style.display='none'">
    </div>
    
    <h1 id="main-title">Publishing to Production</h1>
    <p class="subtitle" id="subtitle-display">Migrating Document ID: {{ document.id }}</p>

    <!-- Terminal Output View -->
    <div class="terminal-card">
      
      <!-- Terminal Controls Mockup -->
      <div class="terminal-header">
        <span class="window-button btn-close"></span>
        <span class="window-button btn-minimize"></span>
        <span class="window-button btn-maximize"></span>
        <span class="terminal-title">postgres-admin@production-db:~ (Schema: PROD)</span>
      </div>
      
      <!-- Live Log Output Area -->
      <div class="terminal-body" id="terminal-body">
        <!-- Live logs will be dynamically injected here via JavaScript -->
      </div>
    </div>

    <!-- Final Success Action -->
    <a href="{{ url_for('dashboard.index') }}" class="return-button" id="return-btn">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path>
        <polyline points="9 22 9 12 15 12 15 22"></polyline>
      </svg>
      Return to Dashboard
    </a>
  </div>

  <!-- ==========================================
       APPLICATION LOGIC & SCRIPTS
       ========================================== -->
  <script>
    /**
     * Manages the visual state and DOM updates for the simulated Terminal UI.
     */
    class TerminalLoggerUI {
      /**
       * Initialize the UI manager with required DOM element IDs.
       * @param {Object} config - Configuration object mapping to DOM IDs.
       */
      constructor(config) {
        // Cache DOM nodes for performance
        this.terminalBody = document.getElementById(config.terminalBodyId);
        this.titleElement = document.getElementById(config.titleElementId);
        this.subtitleElement = document.getElementById(config.subtitleElementId);
        this.spinnerElement = document.getElementById(config.spinnerElementId);
        this.returnBtn = document.getElementById(config.returnBtnId);
        
        // Boot up initial terminal state
        this.initTerminal();
      }

      /**
       * Bootstrap the terminal with connection strings and prompt cursor.
       */
      initTerminal() {
        this.appendLog("Establishing secure connection to PostgreSQL production cluster...", "info");
        this.addPromptLine();
      }

      /**
       * Returns current local time formatted as HH:MM:SS.
       * @returns {string} Formatted timestamp.
       */
      getFormattedTime() {
        const now = new Date();
        return now.toTimeString().split(' ')[0];
      }

      /**
       * Injects a new formatted log line into the terminal window.
       * @param {string} message - The output message text.
       * @param {string} level - Severity level (info, warn, success). Dictates styling.
       */
      appendLog(message, level = "info") {
        // Temporarily remove the blinking prompt to append new logs above it
        const existingPrompt = this.terminalBody.querySelector('.terminal-prompt');
        if (existingPrompt) existingPrompt.remove();

        // Construct log row container
        const line = document.createElement('div');
        line.className = 'log-line';
        
        // Build sub-components using template literals
        const timeSpan = `<span class="log-time">[${this.getFormattedTime()}]</span>`;
        const badgeSpan = `<span class="log-badge badge-${level}">${level}</span>`;
        const messageSpan = `<span class="text-${level}">${message}</span>`;
        
        // Assemble and append to DOM
        line.innerHTML = `${timeSpan} ${badgeSpan} ${messageSpan}`;
        this.terminalBody.appendChild(line);

        // Re-append the active cursor prompt to the bottom
        this.addPromptLine();

        // Ensure the terminal automatically scrolls to the newest entry
        this.terminalBody.scrollTop = this.terminalBody.scrollHeight;
      }

      /**
       * Appends the interactive shell prompt with blinking cursor animation.
       */
      addPromptLine() {
        const prompt = document.createElement('div');
        prompt.className = 'terminal-prompt';
        prompt.innerHTML = `<span>></span><span class="cursor"></span>`;
        this.terminalBody.appendChild(prompt);
      }

      /**
       * Transitions the UI from 'Processing' state to 'Completed' state.
       * @param {string} finalTitle - Text to display in the main H1.
       * @param {string} finalSubtitle - Text to display below the H1.
       */
      completeProcess(finalTitle, finalSubtitle) {
        // Update header typography
        this.titleElement.textContent = finalTitle;
        this.titleElement.classList.add('success-text');
        this.subtitleElement.textContent = finalSubtitle;
        
        // Toggle component visibility
        this.spinnerElement.classList.add('hidden');
        this.returnBtn.style.display = 'inline-flex';
        
        // Append final confirmation to terminal
        this.appendLog("All records have been securely moved to production.", "success");
      }
    }

    // ==========================================
    // EXECUTION & INITIALIZATION
    // ==========================================

    // Instantiate Logger UI
    const terminalUI = new TerminalLoggerUI({
      terminalBodyId: 'terminal-body',
      titleElementId: 'main-title',
      subtitleElementId: 'subtitle-display',
      spinnerElementId: 'main-spinner',
      returnBtnId: 'return-btn'
    });

    // Mock data payload representing background database operations
    const publishSteps = [
      { msg: "Validating signed report constraints and Manager signatures...", level: "warn" },
      { msg: "Migrating AGMT_HEADER_STG & AGMT_MODELS_STG records...", level: "info" },
      { msg: "Inserting AGMT_MDL_NORMAL_STG rates into production tables...", level: "info" },
      { msg: "Verifying AGMT_COMMITMENT entries and volumetric limits...", level: "info" },
      { msg: "Committing transaction to production DB... ACQUIRING ROW LOCKS...", level: "warn" },
      { msg: "Transaction committed successfully. System state synchronized.", level: "success" }
    ];

    let currentStep = 0;
    
    /**
     * Simulation Engine
     * Executes the simulated steps sequentially on a fixed timer.
     */
    const simulateProgress = setInterval(() => {
      if (currentStep < publishSteps.length) {
        // Render next step in queue
        const step = publishSteps[currentStep];
        terminalUI.appendLog(step.msg, step.level);
        currentStep++;
      } else {
        // Sequence completed: Kill timer and transition UI
        clearInterval(simulateProgress);
        terminalUI.completeProcess("Successfully Published!", "Database migration complete.");
      }
    }, 1200); // Progress advances every 1.2 seconds

  </script>
</body>
</html>
