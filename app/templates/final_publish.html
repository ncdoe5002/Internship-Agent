<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Database Publish Status</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
  <style>
    body {
      background-color: #f8fafc;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
    }

    /* Custom Spinner */
    .spinner-wrapper { position: relative; width: 64px; height: 64px; transition: opacity 0.3s; margin: 0 auto; }
    .spinner-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 3px solid #fee2e2; }
    .spinner-progress { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 3px solid transparent; border-top-color: #dc2626; animation: spin 1s linear infinite; }
    .logo-center { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); width: 26px; height: 26px; object-fit: contain; }
    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Card & List */
    .status-card {
      border: 1px solid #e2e8f0;
      border-top: 4px solid #dc2626;
      border-radius: 12px;
      box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
      background-color: white;
      overflow: hidden;
    }
    
    .status-item {
      display: flex; align-items: center; padding: 20px 24px; border-bottom: 1px solid #f1f5f9; gap: 16px; transition: all 0.3s ease;
    }
    .status-item:last-child { border-bottom: none; }
    
    .status-item[data-state="pending"] .item-text { color: #94a3b8; }
    .status-item[data-state="processing"] .item-text { color: #334155; font-weight: 500; }
    .status-item[data-state="completed"] .item-text { color: #0f172a; font-weight: 500; }
    .status-item[data-state="error"] .item-text { color: #dc2626; font-weight: 500; }

    .icon-wrapper { width: 28px; height: 28px; border-radius: 50%; display: flex; justify-content: center; align-items: center; flex-shrink: 0; }
    .status-item[data-state="completed"] .icon-wrapper { background-color: #dcfce7; color: #16a34a; }
    .status-item[data-state="error"] .icon-wrapper { background-color: #fee2e2; color: #dc2626; }
    .status-item[data-state="processing"] .icon-wrapper,
    .status-item[data-state="pending"] .icon-wrapper { background-color: #f1f5f9; }
    
    .status-item[data-state="pending"] .dot { width: 6px; height: 6px; border-radius: 50%; background-color: #cbd5e1; }
    .status-item[data-state="processing"] .dot { width: 8px; height: 8px; border-radius: 50%; background-color: #dc2626; animation: pulse 1.2s infinite; }
    @keyframes pulse { 0%, 100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.7); } }

    /* Button */
    .btn-return {
      background-color: #0f172a; color: white; transition: all 0.2s; display: none;
    }
    .btn-return:hover { background-color: #1e293b; color: white; transform: translateY(-1px); }
  </style>
</head>
<body>

  <div class="container" style="max-width: 600px;">
    
    <div class="text-center mb-4">
      <div class="spinner-wrapper mb-3" id="main-spinner">
        <div class="spinner-bg"></div>
        <div class="spinner-progress"></div>
        <img src="{{ url_for('static', filename='images/Logo-EDCH.png') }}" alt="Logo" class="logo-center" onerror="this.style.display='none'">
      </div>
      <h3 id="main-title" class="fw-bold text-dark mb-1">Publishing to Production</h3>
      <p id="subtitle-display" class="text-muted">Migrating Document ID: {{ document.id }}</p>
    </div>

    <div class="status-card w-100 mb-4">
      <ul class="list-unstyled m-0" id="status-list"></ul>
    </div>

    <div class="text-center">
      <a href="{{ url_for('dashboard.index') }}" class="btn btn-return px-4 py-2 fw-medium rounded-pill shadow-sm" id="return-btn">
        <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" class="me-2"><path d="M3 9l9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"></path><polyline points="9 22 9 12 15 12 15 22"></polyline></svg>
        Return to Dashboard
      </a>
    </div>

  </div>

  <script>
    class DatabasePublishUI {
      constructor(config) {
        this.listElement = document.getElementById(config.listElementId);
        this.titleElement = document.getElementById(config.titleElementId);
        this.subtitleElement = document.getElementById(config.subtitleElementId);
        this.spinnerElement = document.getElementById(config.spinnerElementId);
        this.returnBtn = document.getElementById(config.returnBtnId);
        
        this.icons = {
          check: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"></polyline></svg>`,
          error: `<svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"></line><line x1="6" y1="6" x2="18" y2="18"></line></svg>`,
          dot: `<div class="dot"></div>`
        };

        this.steps = new Map();
        config.initialSteps.forEach((step, index) => {
          this.steps.set(index, { id: step.id, label: step.label, state: 'pending' }); 
        });

        this.renderAll();
      }

      updateStepByIndex(index, newState) {
        if (!this.steps.has(index)) return;
        const step = this.steps.get(index);
        step.state = newState;
        
        const listItem = document.getElementById(`step-${step.id}`);
        if (listItem) {
          listItem.setAttribute('data-state', newState);
          const iconWrapper = listItem.querySelector('.icon-wrapper');
          if (newState === 'completed') iconWrapper.innerHTML = this.icons.check;
          else if (newState === 'error') iconWrapper.innerHTML = this.icons.error;
          else iconWrapper.innerHTML = this.icons.dot;
        }
      }

      completeProcess(success = true) {
        this.spinnerElement.classList.add('d-none');
        if (success) {
            this.titleElement.textContent = "Successfully Published!";
            this.titleElement.classList.replace("text-dark", "text-success");
            this.subtitleElement.textContent = "All records have been securely moved to production.";
            this.returnBtn.style.display = 'inline-flex';
        } else {
            this.titleElement.textContent = "Publishing Failed";
            this.titleElement.classList.replace("text-dark", "text-danger");
            this.subtitleElement.textContent = "Check system logs for details.";
            this.returnBtn.style.display = 'inline-flex';
            this.returnBtn.textContent = "Go Back";
            this.returnBtn.classList.add("bg-danger");
        }
      }

      renderAll() {
        this.listElement.innerHTML = '';
        this.steps.forEach((stepData, index) => {
          const li = document.createElement('li');
          li.id = `step-${stepData.id}`;
          li.className = 'status-item';
          li.setAttribute('data-state', stepData.state);
          li.innerHTML = `<div class="icon-wrapper">${this.icons.dot}</div><span class="item-text">${stepData.label}</span>`;
          this.listElement.appendChild(li);
        });
      }
    }

    const publishUI = new DatabasePublishUI({
      listElementId: 'status-list',
      titleElementId: 'main-title',
      subtitleElementId: 'subtitle-display',
      spinnerElementId: 'main-spinner',
      returnBtnId: 'return-btn',
      initialSteps: [
        { id: 'validate', label: 'Validating signed report constraints' },
        { id: 'header', label: 'Migrating AgmtHeaderStg & AgmtModelsStg' },
        { id: 'rates', label: 'Inserting AgmtMdlNormalStg rates' },
        { id: 'commitments', label: 'Verifying AgmtCommitment entries' },
        { id: 'finalize', label: 'Committing transaction to production DB' }
      ]
    });

    let currentStep = 0;
    const totalSteps = 5;
    
    publishUI.updateStepByIndex(currentStep, 'processing');

    const simulateProgress = setInterval(() => {
      publishUI.updateStepByIndex(currentStep, 'completed');
      currentStep++;
      
      if (currentStep < totalSteps) {
        publishUI.updateStepByIndex(currentStep, 'processing');
      } else {
        clearInterval(simulateProgress);
        publishUI.completeProcess(true);
      }
    }, 1200);
  </script>
</body>
</html>
