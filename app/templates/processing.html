<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>AI Processing Terminal - EDCH</title>
  <style>
    /* Reset & Base Styles */
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background-color: #0f172a; /* Slate 900 for dark developer feel */
      display: flex; 
      justify-content: center; 
      align-items: center;
      min-height: 100vh; 
      color: #f8fafc;
      flex-direction: column;
    }
    .container { 
      width: 100%; 
      max-width: 750px; 
      padding: 20px; 
      display: flex; 
      flex-direction: column; 
      align-items: center; 
    }

    /* Spinner Styles */
    .spinner-wrapper { position: relative; width: 56px; height: 56px; margin-bottom: 20px; transition: opacity 0.3s; }
    .spinner-wrapper.hidden { opacity: 0; pointer-events: none; }
    .spinner-bg { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 2px solid #334155; }
    .spinner-progress { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border-radius: 50%; border: 2px solid transparent; border-top-color: #ef4444; animation: spin 1s linear infinite; }
    
    .logo-center { 
      position: absolute; 
      top: 50%; 
      left: 50%; 
      transform: translate(-50%, -50%); 
      width: 24px; 
      height: 24px; 
      object-fit: contain;
    }

    @keyframes spin { 100% { transform: rotate(360deg); } }

    /* Typography */
    h1 { font-size: 1.4rem; font-weight: 600; margin-bottom: 6px; color: #f1f5f9; text-align: center; }
    .filename { font-family: ui-monospace, monospace; font-size: 0.85rem; color: #94a3b8; margin-bottom: 24px; }

    /* Terminal Window Card */
    .terminal-card {
      width: 100%;
      background-color: #1e1e2e; /* Catppuccin / VSCode Dark theme */
      border-radius: 10px;
      box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #313244;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* Terminal Header Bar */
    .terminal-header {
      background-color: #181825;
      padding: 10px 16px;
      display: flex;
      align-items: center;
      gap: 8px;
      border-bottom: 1px solid #313244;
      user-select: none;
    }
    .window-button { width: 12px; height: 12px; border-radius: 50%; display: inline-block; }
    .btn-close { background-color: #f38ba8; }
    .btn-minimize { background-color: #f9e2af; }
    .btn-maximize { background-color: #a6e3a1; }
    .terminal-title {
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', monospace;
      font-size: 0.75rem;
      color: #a6adc8;
      margin-left: auto;
      margin-right: auto;
    }

    /* Terminal Screen Area */
    .terminal-body {
      padding: 16px;
      height: 320px;
      overflow-y: auto;
      font-family: ui-monospace, 'Cascadia Code', 'Source Code Pro', Menlo, Consolas, monospace;
      font-size: 0.85rem;
      line-height: 1.6;
      color: #cdd6f4;
      background-color: #11111b;
      display: flex;
      flex-direction: column;
      gap: 6px;
    }

    /* Terminal Log Line Styling */
    .log-line { display: flex; align-items: flex-start; gap: 8px; word-break: break-word; }
    .log-time { color: #585b70; flex-shrink: 0; font-size: 0.75rem; }
    .log-badge {
      font-size: 0.7rem;
      font-weight: 700;
      padding: 1px 5px;
      border-radius: 3px;
      text-transform: uppercase;
      flex-shrink: 0;
    }
    
    /* Log Types */
    .badge-info { background-color: #313244; color: #89b4fa; }
    .badge-success { background-color: #274d35; color: #a6e3a1; }
    .badge-error { background-color: #5c232c; color: #f38ba8; }
    .badge-warn { background-color: #5c4d23; color: #f9e2af; }
    
    .text-info { color: #cdd6f4; }
    .text-success { color: #a6e3a1; }
    .text-error { color: #f38ba8; }
    .text-warn { color: #f9e2af; }

    /* Flashing Prompt Cursor */
    .terminal-prompt { display: flex; align-items: center; gap: 8px; margin-top: 4px; color: #89b4fa; }
    .cursor {
      display: inline-block;
      width: 8px;
      height: 15px;
      background-color: #89b4fa;
      animation: blink 1s infinite;
    }
    @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0; } }

    /* Custom Scrollbar for Terminal */
    .terminal-body::-webkit-scrollbar { width: 8px; }
    .terminal-body::-webkit-scrollbar-track { background: #11111b; }
    .terminal-body::-webkit-scrollbar-thumb { background: #313244; border-radius: 4px; }
    .terminal-body::-webkit-scrollbar-thumb:hover { background: #45475a; }

    /* Skip Button */
    .skip-button {
      margin-top: 24px;
      padding: 10px 20px;
      background-color: #1e1e2e;
      color: #a6adc8;
      border: 1px solid #313244;
      border-radius: 6px;
      font-size: 0.85rem;
      font-weight: 500;
      text-decoration: none;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 8px;
    }
    .skip-button:hover {
      background-color: #313244;
      color: #f5e0dc;
      border-color: #45475a;
    }
  </style>
</head>
<body>

  <!-- Hidden data element to pass the doc ID cleanly to JS -->
  <meta id="doc-data" data-doc-id="{{ document.id }}">

  <div class="container">
    <div class="spinner-wrapper" id="main-spinner">
      <div class="spinner-bg"></div>
      <div class="spinner-progress"></div>
      <img src="{{ url_for('static', filename='images/Logo-EDCH.png') }}" alt="EDCH Logo" class="logo-center">
    </div>
    
    <h1 id="main-title">Worker Execution Pipeline</h1>
    <p class="filename" id="file-name-display"></p>

    <!-- Terminal UI Component -->
    <div class="terminal-card">
      <div class="terminal-header">
        <span class="window-button btn-close"></span>
        <span class="window-button btn-minimize"></span>
        <span class="window-button btn-maximize"></span>
        <span class="terminal-title">celery-worker@edch-engine:~ (GPU: RTX 4050)</span>
      </div>
      <div class="terminal-body" id="terminal-body">
        <!-- Live logs will be dynamically injected here -->
      </div>
    </div>

    <!-- Skip Button -->
    <a href="/update/extracted/{{ document.id }}" class="skip-button">
      Skip to Extracted Data
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <line x1="5" y1="12" x2="19" y2="12"></line>
        <polyline points="12 5 19 12 12 19"></polyline>
      </svg>
    </a>
  </div>

  <script>
    class TerminalLoggerUI {
      constructor(config) {
        this.terminalBody = document.getElementById(config.terminalBodyId);
        this.titleElement = document.getElementById(config.titleElementId);
        this.spinnerElement = document.getElementById(config.spinnerElementId);
        this.fileNameElement = document.getElementById(config.fileNameElementId);
        
        this.fileNameElement.textContent = config.fileName || 'document.pdf';
        this.seenStepIndex = -1;

        // Map backend step numbers to realistic terminal log messages
        this.stepLogMap = {
          0: "Initializing CUDA context & loading Docling PDF analyzer...",
          1: "Extracting tariff tables & structural markup from document...",
          2: "Matching extracted items against EDCH service catalogue...",
          3: "Sending schema payload to Gemini API for validation...",
          4: "Persisting validated agreement data to PostgreSQL database..."
        };

        this.initTerminal();
      }

      initTerminal() {
        this.appendLog("Celery worker process initialized. Listening for tasks...", "info");
        this.appendLog(`Target file acquired: ${this.fileNameElement.textContent}`, "info");
        this.addPromptLine();
      }

      getFormattedTime() {
        const now = new Date();
        return now.toTimeString().split(' ')[0];
      }

      appendLog(message, level = "info") {
        // Remove prompt line temporarily to append text above it
        const existingPrompt = this.terminalBody.querySelector('.terminal-prompt');
        if (existingPrompt) existingPrompt.remove();

        const line = document.createElement('div');
        line.className = 'log-line';
        
        const timeSpan = `<span class="log-time">[${this.getFormattedTime()}]</span>`;
        const badgeSpan = `<span class="log-badge badge-${level}">${level}</span>`;
        const messageSpan = `<span class="text-${level}">${message}</span>`;
        
        line.innerHTML = `${timeSpan} ${badgeSpan} ${messageSpan}`;
        this.terminalBody.appendChild(line);

        // Re-add prompt cursor line at bottom
        this.addPromptLine();

        // Auto-scroll to bottom
        this.terminalBody.scrollTop = this.terminalBody.scrollHeight;
      }

      addPromptLine() {
        const prompt = document.createElement('div');
        prompt.className = 'terminal-prompt';
        prompt.innerHTML = `<span>></span><span class="cursor"></span>`;
        this.terminalBody.appendChild(prompt);
      }

      processStepUpdate(stepIndex, customMessage = null) {
        if (stepIndex > this.seenStepIndex) {
          this.seenStepIndex = stepIndex;
          const logMsg = customMessage || this.stepLogMap[stepIndex] || `Executing pipeline step ${stepIndex}...`;
          this.appendLog(logMsg, "info");
        }
      }

      completeProcess(finalTitle = "Processing Complete", isSuccess = true) {
        this.titleElement.textContent = finalTitle;
        this.spinnerElement.classList.add('hidden');
        
        if (isSuccess) {
          this.appendLog("Pipeline executed successfully [0 errors]. Redirecting...", "success");
        } else {
          this.appendLog("Critical exception encountered in Celery worker thread.", "error");
        }
      }
    }

    // Grab doc_id from meta tag
    const docDataElement = document.getElementById('doc-data');
    const docId = parseInt(docDataElement.dataset.docId, 10);

    // Initialize Terminal Logger
    const terminalUI = new TerminalLoggerUI({
      terminalBodyId: 'terminal-body',
      titleElementId: 'main-title',
      spinnerElementId: 'main-spinner',
      fileNameElementId: 'file-name-display',
      fileName: '{{ document.filename }}'
    });

    // Start Polling Loop
    const pollInterval = setInterval(async () => {
      try {
        const response = await fetch(`/api/update/${docId}/status`);
        const data = await response.json();
        
        // Log custom message if API provides one, or fall back to step index
        if (data.current_step !== undefined) {
          terminalUI.processStepUpdate(data.current_step, data.message || null);
        } else if (data.message) {
          terminalUI.appendLog(data.message, "info");
        }

        if (data.status === 'READY') {
          clearInterval(pollInterval);
          terminalUI.completeProcess("Analysis Finished", true);
          setTimeout(() => { window.location.href = `/update/extracted/${docId}`; }, 1200);
        } else if (data.status === 'FAILED' || data.status === 'ERROR') {
          clearInterval(pollInterval);
          if (data.error) {
            terminalUI.appendLog(`Error details: ${data.error}`, "error");
          }
          terminalUI.completeProcess("Worker Failed", false);
        }
      } catch (error) {
        terminalUI.appendLog(`Network warning: ${error.message}`, "warn");
      }
    }, 2000);
  </script>
</body>
</html>
