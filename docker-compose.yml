services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: prasanth2contractextract
      POSTGRES_DB: edch_adivisor
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./app/static/pdfs:/app/app/static/pdfs
    ports:
      - "5432:5432"

  redis:
    image: redis:7-alpine
    restart: unless-stopped
    ports:
      - "6379:6379"

  web:
    build: .
    restart: unless-stopped
    command: gunicorn wsgi:app --bind 0.0.0.0:8000 --workers 2 --timeout 120
    ports:
      - "8000:8000"
    volumes:
      - ./uploads:/app/uploads
      - ./app/static/pdfs:/app/app/static/pdfs
    env_file:
      - .env
    environment:
      # Override .env values with Docker-internal service hostnames.
      # "postgres" and "redis" are the service names above, which Docker
      # resolves inside the container network. The .env uses "localhost"
      # which is only correct when Flask runs directly on your host machine.
      DATABASE_URL: "postgresql://postgres:prasanth2contractextract@postgres:5432/edch_adivisor"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - postgres
      - redis

  worker:
    build: .
    restart: unless-stopped
    command: celery -A celery_worker.celery worker --loglevel=info --concurrency=2
    volumes:
      - .:/app                    # ADD THIS
      - ./uploads:/app/uploads 
      - ./app/static/pdfs:/app/app/static/pdfs
    env_file:
      - .env
    environment:
      DATABASE_URL: "postgresql://postgres:prasanth2contractextract@postgres:5432/edch_adivisor"
      REDIS_URL: "redis://redis:6379/0"
    depends_on:
      - postgres
      - redis

    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              count: 1
              capabilities: [gpu]

volumes:
  postgres_data: